# Conda environment for the "Large-scale models" course project.
# Based on the course environment (course-uge/environment.yml); major versions only.
#   conda env create -f environment.yml
#   conda activate lsm
name: lsm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyter=1
  - numpy=1
  - pandas=2
  - geopandas>=1.1        # dissolve(method="coverage"), simplify_coverage (ex11)
  - shapely>=2.1
  - pyarrow=14
  - matplotlib-base=3
  - plotly=5
  - scikit-learn=1
  - osmnx=1
  - pyrosm=0.6
  - osmium-tool=1
  - tqdm=4
